version: '3.8'

services:
  synapsesql:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synapsesql-app
    restart: unless-stopped
    ports:
      # Host 8000 -> container 10000 (Render's default $PORT)
      - "8000:10000"
    env_file:
      - .env
    volumes:
      # Persist SQLite databases and uploads across container rebuilds
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - ENVIRONMENT=production
